# Symbols to track, comma separated (max 10 — yfinance issues one request per symbol)
TICKER=AMD,AAPL,MSFT

# Text colors
COLOR_POSITIVE=#0FAF50
COLOR_NEGATIVE=#EB3C3C
COLOR_ERROR_BORDER=#FF2828

# Background colors
COLOR_PREMARKET=#FFFFE0
COLOR_OPEN=#E0FFE0
COLOR_AFTER_HOURS=#E0E0FF
COLOR_CLOSED=#323232

# Ticker symbol scroll speed, in milliseconds per character
SCROLL_SPEED_MS=500

# How long the price is shown after scrolling (seconds)
DISPLAY_SECONDS=8